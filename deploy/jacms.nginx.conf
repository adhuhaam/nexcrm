# JACMS — reverse proxy to Node on 127.0.0.1:3000
# Installed to /etc/nginx/sites-available/jacms

upstream jacms_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP — all interfaces (local, LAN, Tailscale IP)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name server server-1.snowy-pride.ts.net 192.168.100.10 100.77.125.102 _;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://jacms_upstream;
        proxy_read_timeout 120s;
    }
}

# LAN HTTPS only on the Wi‑Fi address (Tailscale HTTPS stays on Tailscale Serve :443)
server {
    listen 192.168.100.10:443 ssl;
    server_name 192.168.100.10 server;

    ssl_certificate     /etc/nginx/ssl/jacms-lan.crt;
    ssl_certificate_key /etc/nginx/ssl/jacms-lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_pass http://jacms_upstream;
        proxy_read_timeout 120s;
    }
}
