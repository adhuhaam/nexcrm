# JACMS — reverse proxy to Node on 127.0.0.1:3000
# Installed to /etc/nginx/sites-available/jacms (PUBLIC_DOMAIN substituted by install.sh)

upstream jacms_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name jacms.bluraymaldives.site _;

    client_max_body_size 25m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://jacms_upstream;
        proxy_read_timeout 120s;
    }
}
