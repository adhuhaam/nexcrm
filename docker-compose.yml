services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: jacms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: jacms
    volumes:
      - jacms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jacms -d jacms"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jacms:${POSTGRES_PASSWORD}@postgres:5432/jacms
      FILES_DIR: /data/files
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-jacms.bluraymaldives.site}
      APP_URL: ${APP_URL:-https://jacms.bluraymaldives.site}
      DISPLAY_TIME_ZONE: ${DISPLAY_TIME_ZONE:-Indian/Maldives}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - jacms_files:/data/files

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"

  backup:
    image: postgres:16-bookworm
    profiles: ["ops"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jacms_backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        while true; do
          STAMP=$$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump -h postgres -U jacms jacms | gzip -9 >"/backups/jacms-$${STAMP}.sql.gz"
          find /backups -type f -name 'jacms-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN for tunnel profile}

volumes:
  jacms_pgdata:
  jacms_files:
  jacms_backups:
